<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balade 12 : Cimetière du Père-Lachaise — Paris en chanteurs</title>
    <meta name="description" content="Accédez instantanément à la playlist musicale pour la balade Cimetière du Père-Lachaise de Paris en chanteurs.">
    
    <!-- Mobile-first high performance inline CSS -->
    <style>
        :root {
            --color-primary: #009f70;
            --color-primary-dark: #005c41;
            --color-primary-light: #e6f6f1;
            --color-secondary: #feecda;
            --color-text-main: #1c1c1c;
            --color-text-muted: #555555;
            --color-white: #ffffff;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --radius-md: 16px;
            --radius-sm: 8px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

        @font-face {
            font-family: 'Raghero';
            src: url('../sources/Raghero-regular.otf') format('opentype'),
                 url('/sources/Raghero-regular.otf') format('opentype');
            font-style: normal;
            font-weight: normal;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--color-secondary);
            color: var(--color-text-main);
            font-family: var(--font-sans);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .card {
            background-color: var(--color-white);
            border: 1px solid #f8dfc5;
            border-radius: var(--radius-md);
            padding: 30px 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0, 92, 65, 0.08);
            margin: auto 0;
        }

        .header-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--color-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--color-secondary);
            font-family: var(--font-serif);
            font-weight: bold;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .logo-text {
            display: block;
            font-family: var(--font-serif);
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--color-primary-dark);
        }

        #walkTitle {
            font-family: 'Raghero', var(--font-serif);
            font-style: normal;
            text-transform: uppercase;
            font-size: 1.8rem;
            color: var(--color-primary-dark);
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--color-text-muted);
            margin-bottom: 20px;
        }

        .meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background-color: #faf6f0;
            padding: 12px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-bottom: 24px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
        }

        .playlist-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .playlist-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 1rem;
            color: var(--color-white);
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .playlist-btn:hover {
            transform: scale(1.03);
            color: var(--color-white) !important;
        }

        .playlist-btn:active {
            transform: scale(0.98);
        }

        .btn-deezer {
            background-color: #A238FF;
        }
        .btn-deezer:hover {
            background-color: #8c2ee0;
        }
        .btn-spotify {
            background-color: #1DB954;
        }
        .btn-spotify:hover {
            background-color: #1aa34a;
        }
        .btn-youtube {
            background-color: #FF0000;
        }
        .btn-youtube:hover {
            background-color: #e60000;
        }

        .playlist-btn img {
            width: 24px;
            height: 24px;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
        }

        .footer-link {
            color: var(--color-primary-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 1px solid currentColor;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-logo">
            <div class="logo-circle">P</div>
            <span class="logo-text">Paris en chanteurs</span>
        </div>

        <div style="text-align: center;">
            <h1 class="title" id="walkTitle">Cimetière du Père-Lachaise</h1>
            <p class="subtitle" id="walkSubtitle">Les mélodies mélancoliques de la Seine</p>
        </div>

        <div class="meta">
            <div class="meta-item">
                <span>⏱</span>
                <span id="walkDuration">2h00</span>
            </div>
            <div class="meta-item">
                <span>📍</span>
                <span id="walkDistance">3.4 km</span>
            </div>
        </div>

        <div class="playlist-buttons">
            <a href="https://www.deezer.com/fr/playlist/123456789" target="_blank" rel="noopener" class="playlist-btn btn-deezer" id="linkDeezer">
                <span>Écouter sur Deezer</span>
                <img src="/sources/deezer-logo.svg" alt="Deezer Logo">
            </a>
            
            <a href="https://open.spotify.com/playlist/37i9dQZF1DXdgn7jofZ3pG" target="_blank" rel="noopener" class="playlist-btn btn-spotify" id="linkSpotify">
                <span>Écouter sur Spotify</span>
                <img src="/sources/spotify-logo.svg" alt="Spotify Logo">
            </a>
            
            <a href="https://music.youtube.com/playlist?list=PL4fGSI1pDJn5k7_c29f6G4w5O5j4p_aB2" target="_blank" rel="noopener" class="playlist-btn btn-youtube" id="linkYoutube">
                <span>Écouter sur YouTube Music</span>
                <img src="/sources/youtube-music-logo.svg" alt="YouTube Music Logo">
            </a>
        </div>
    </div>

    <div class="footer">
        <a href="../index.html" class="footer-link">Visiter le site complet</a>
    </div>

    <!-- Client-side script to fetch latest updates from data.json -->
    <script>
        const WALK_KEY = "perelachaise";
        
        // Fetch data.json to keep playlists dynamically synchronized
        fetch('../data.json')
            .then(res => {
                if (!res.ok) throw new Error("JSON fetch failed");
                return res.json();
            })
            .then(data => {
                const walk = data.playlists[WALK_KEY];
                if (walk) {
                    document.getElementById('walkTitle').textContent = walk.title;
                    document.getElementById('walkSubtitle').textContent = walk.subtitle;
                    document.getElementById('walkDuration').textContent = walk.duration;
                    document.getElementById('walkDistance').textContent = walk.distance;
                    
                    document.getElementById('linkSpotify').href = walk.spotify;
                    document.getElementById('linkDeezer').href = walk.deezer;
                    document.getElementById('linkYoutube').href = walk.youtube;
                }
            })
            .catch(err => {
                console.warn("Using offline walk fallbacks: ", err);
            });
    </script>
</body>
</html>
